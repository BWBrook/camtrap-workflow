schema_version_path: "schema_version.txt"
run_id: "camtrapdp_example"
timezone: "UTC"
event_threshold_minutes: 15
input_mode: "camtrapdp"

validation:
  repair_decisions: []

entity_resolution:
  profile_id: null
  sidecar_path: null
  sidecar_sha256: null
  authority_reference: null

deployment_evidence:
  profile_id: null
  service_sidecar_path: null
  service_sidecar_sha256: null
  deployment_ledger_path: null
  deployment_ledger_sha256: null
  authority_reference: null

analysis_unit:
  resolution: "physical_location"
  mapping_profile_id: null
  mapping_path: null
  mapping_sha256: null
  authority_reference: null

camtrapdp_acquisition:
  mode: "remote"
  cache_dir: "outputs/cache/camtrapdp"
  descriptor_sha256: "41a0bfec15e522ff0e5c670266c9d3be99fff1e01448cd0e508e97c355b58590"
  resource_sha256:
    deployments.csv: "96084baa2eaac9221780ebd0fc096c23a1317b354931b71be0335280e4bcec7b"
    media.csv: "910596bb60af429fc955f17401ce98b915e9c8e72e491c1e715f3b51cfc6bbce"
    observations.csv: "845cfb09da01f3e60139b1c5b31088318ff17b7f4bafcc913bd7cd63f01289ca"

paths:
  inputs:
    site: null
    op: null
    obs: null
    taxa: null
    camtrapdp: "https://raw.githubusercontent.com/tdwg/camtrap-dp/1.0.1/example/datapackage.json"
  outputs: "outputs"

analysis:
  rarefaction: true
  report: true

spatial_map:
  enable: true
  surface_var: "ndvi"
  resolution: 200
  buffer_deg: 0.002
  buffer_frac: 0.1
  label_sites: false
  label_size: 2.5
  label_nudge_frac: 0.01
  show_north_arrow: true
  show_scale_bar: true
  scale_bar_km: 1

time_qc:
  backward_jump_threshold_hours: 1

diel:
  method: "flash"
  day_start_hour: 6
  day_end_hour: 18

sensitivity:
  event_threshold_minutes: [5, 15, 30, 60]
  occasion_length_days: [3, 7, 14, 30]

detection_history:
  occasion_length_days: 7
  start_date: null

occupancy:
  species: ["anas_platyrhynchos", "mustela_putorius", "unknown"]
  top_n: 3

traits:
  species_column: "short"
  columns: ["diet", "sec_diet", "activity", "habitat", "status", "body_size", "sociality", "mobility"]
  association_traits: ["diet", "activity", "habitat", "body_size", "status"]
  environment_vars: ["elevation_m", "canopy_h_m", "ndvi"]

camtrapdp_export:
  enable: false
  name: "camtrap-workflow-export"
  title: "camtrap-workflow export"
  description: "Camtrap DP export generated by camtrap-workflow."
  version: "1.0.1"
  license: "CC0-1.0"
  id: null
  created: null
