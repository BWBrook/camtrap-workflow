schema_version_path: "schema_version.txt"
run_id: "latest"
timezone: "Australia/Hobart"
timezone_fixed_offset_hours: 10
event_threshold_minutes: 15
input_mode: "four_table"

paths:
  inputs:
    site: "data/jc_site.csv"
    op: "data/jc_op.csv"
    obs: "data/jc_obs.csv"
    taxa: "data/jc_taxa.csv"
    camtrapdp: null
  outputs: "outputs"

analysis:
  rarefaction: true
  report: true

spatial_map:
  enable: true
  surface_var: "ndvi"
  resolution: 200
  buffer_deg: 0.01

time_qc:
  backward_jump_threshold_hours: 1

diel:
  method: "flash"
  day_start_hour: 6
  day_end_hour: 18

sensitivity:
  event_threshold_minutes: [5, 15, 30, 60]
  occasion_length_days: [3, 7, 14, 30]

detection_history:
  occasion_length_days: 7
  start_date: null

occupancy:
  species: ["pad", "pos", "wal", "cat", "sbb"]
  top_n: 3
  covariates: ["canopy_h_m", "ndvi"]

traits:
  species_column: "short"
  columns: ["diet", "sec_diet", "activity", "habitat", "status", "body_size", "sociality", "mobility"]
  association_traits: ["diet", "activity", "habitat", "body_size", "status"]
  environment_vars: ["elevation_m", "canopy_h_m", "ndvi"]

camtrapdp_export:
  enable: false
  name: "camtrap-workflow-export"
  title: "camtrap-workflow export"
  description: "Camtrap DP export generated by camtrap-workflow."
  version: "1.0.1"
  license: "CC0-1.0"
  id: null
  created: null
