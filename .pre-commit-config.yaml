# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
repos:
  - repo: local
    hooks:
      - id: sync-data-dictionary
        name: Sync data dictionary from markdown
        # NOTE: Update 'entry' path to Rscript.exe as appropriate for your system.
        entry: 'C:/Users/bwbrook/AppData/Local/Programs/R/R-4.5.0/bin/Rscript.exe scripts/update_data_dictionary.R'
        language: system
        files: ^data_dictionary\.md$
      - id: check-dictionary-synchrony
        name: Check data dictionary synchrony
        entry: bash -c "git diff --exit-code data/data_dictionary.csv"
        language: system
        pass_filenames: false
        files: ^data_dictionary\.md$
