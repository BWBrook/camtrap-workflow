name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Test profile to run
        required: true
        default: fast
        type: choice
        options:
          - fast
          - release

jobs:
  fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglpk-dev \
            libjq-dev \
            libnode-dev \
            libuv1-dev \
            libx11-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff5-dev \
            cmake

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      - name: Restore packages (renv)
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Check workflow syntax
        uses: docker://rhysd/actionlint:1.7.7

      - name: Lint
        run: Rscript scripts/run_lint.R

      - name: Fast tests
        run: Rscript scripts/run_tests.R --profile fast

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'release'
    needs: fast
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglpk-dev \
            libjq-dev \
            libnode-dev \
            libuv1-dev \
            libx11-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff5-dev \
            cmake \
            pandoc

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      - name: Restore packages (renv)
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Record release context
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          {
            printf 'commit_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'runner_name=%s\n' "${RUNNER_NAME}"
            printf 'runner_os=%s\n' "${RUNNER_OS}"
            printf 'runner_arch=%s\n' "${RUNNER_ARCH}"
            printf 'runner_image=%s\n' "${ImageOS:-unknown}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'renv_lock_sha256=%s\n' "$(sha256sum renv.lock | cut -d' ' -f1)"
            printf '%s\n' \
              'publisher_command=Rscript scripts/run_full_evidence_run.R --config config.yml'
          } > release-evidence.txt
          # shellcheck disable=SC2016
          Rscript -e '
            cat("renv_status_begin\n")
            renv::status()
            cat("renv_status_end\n")
            cat("renv_cache=", renv::paths$cache(), "\n", sep = "")
            cat("installed_package_count=", nrow(installed.packages()), "\n", sep = "")
          ' >> release-evidence.txt

      - name: Full Judbury publisher
        run: |
          /usr/bin/time -p -o publisher.time \
            Rscript scripts/run_full_evidence_run.R --config config.yml
          RUN_ID="$(tr -d '\n' < outputs/latest)"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          printf 'published_run_id=%s\n' "${RUN_ID}" >> release-evidence.txt

      - name: Independent published-bundle reconstruction
        run: |
          printf '%s\n' \
            "verifier_command=Rscript scripts/verify_published_bundle.R outputs/runs/${RUN_ID} --oracle tests/fixtures/goal011/judbury_selected_jaccard_oracle.csv" \
            >> release-evidence.txt
          /usr/bin/time -p -o verifier.time \
            Rscript scripts/verify_published_bundle.R \
              "outputs/runs/${RUN_ID}" \
              --oracle tests/fixtures/goal011/judbury_selected_jaccard_oracle.csv

      - name: Record release timings
        if: always()
        run: |
          {
            printf 'publisher\n'
            test -f publisher.time && cat publisher.time || printf 'not completed\n'
            printf '\nindependent verifier\n'
            test -f verifier.time && cat verifier.time || printf 'not completed\n'
          } > release-timings.txt

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: immutable-evidence-bundle
          if-no-files-found: error
          path: |
            outputs/latest
            outputs/runs/*/
            !outputs/runs/.staging/
            release-evidence.txt
            publisher.time
            verifier.time
            release-timings.txt

      - name: Upload failed-release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-diagnostics
          if-no-files-found: error
          path: |
            release-evidence.txt
            publisher.time
            verifier.time
            release-timings.txt
