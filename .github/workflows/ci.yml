name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Test profile to run
        required: true
        default: fast
        type: choice
        options:
          - fast
          - release

jobs:
  fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libjq-dev \
            libnode-dev \
            libuv1-dev \
            libx11-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff5-dev \
            cmake

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      - name: Restore packages (renv)
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Check workflow syntax
        uses: docker://rhysd/actionlint:1.7.7

      - name: Lint
        run: Rscript scripts/run_lint.R

      - name: Fast tests
        run: Rscript scripts/run_tests.R --profile fast

      - name: End-to-end publication smoke
        run: Rscript -e 'testthat::test_file("tests/testthat/test_workflow_end_to_end.R", reporter = "summary")'

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'release'
    needs: fast
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libjq-dev \
            libnode-dev \
            libuv1-dev \
            libx11-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff5-dev \
            cmake \
            pandoc

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      - name: Restore packages (renv)
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Full Judbury publisher
        run: |
          /usr/bin/time -p -o publisher.time \
            Rscript scripts/run_full_evidence_run.R --config config.yml
          RUN_ID="$(tr -d '\n' < outputs/latest)"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"

      - name: Independent published-bundle reconstruction
        run: |
          /usr/bin/time -p -o verifier.time \
            Rscript scripts/verify_published_bundle.R \
              "outputs/runs/${RUN_ID}" \
              --oracle tests/fixtures/goal011/judbury_selected_jaccard_oracle.csv

      - name: Record release timings
        if: always()
        run: |
          {
            printf 'publisher\n'
            test -f publisher.time && cat publisher.time || printf 'not completed\n'
            printf '\nindependent verifier\n'
            test -f verifier.time && cat verifier.time || printf 'not completed\n'
          } > release-timings.txt

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-evidence-bundle
          if-no-files-found: warn
          path: |
            outputs/latest
            outputs/runs/*/
            !outputs/runs/.staging/
            release-timings.txt
