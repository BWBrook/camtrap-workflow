name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  r-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglpk40 \
            libglpk-dev \
            libjq-dev \
            libnode-dev \
            libuv1-dev \
            libx11-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff5-dev \
            cmake \
            pandoc

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX (PDF reports)
        run: quarto install tinytex --no-prompt

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      - name: Restore packages (renv)
        uses: r-lib/actions/setup-renv@v2

      - name: Lint
        run: Rscript scripts/run_lint.R

      - name: Unit tests
        run: Rscript scripts/run_tests.R

      - name: Pipeline smoke test
        run: Rscript -e 'targets::tar_make(names = "input_contract_validation", callr_function = NULL)'

      - name: Full immutable evidence run
        run: Rscript scripts/run_full_evidence_run.R --config config.yml

      - name: Verify published evidence bundle
        run: |
          RUN_ID="$(tr -d '\n' < outputs/latest)"
          Rscript scripts/run_full_evidence_run.R \
            --verify-bundle "outputs/runs/${RUN_ID}"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-evidence-bundle
          if-no-files-found: warn
          path: |
            outputs/latest
            outputs/runs/*/
            !outputs/runs/.staging/
