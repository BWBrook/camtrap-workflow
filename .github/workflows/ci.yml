name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  r-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglpk40 \
            libglpk-dev \
            libjq-dev

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX (PDF reports)
        run: quarto install tinytex --no-prompt

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Restore packages (renv)
        uses: r-lib/actions/setup-renv@v2

      - name: Lint
        run: Rscript scripts/run_lint.R

      - name: Unit tests
        run: Rscript scripts/run_tests.R

      - name: Pipeline smoke test
        run: Rscript -e 'targets::tar_make(names = "input_contract_validation", callr_function = NULL)'

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          if-no-files-found: warn
          path: |
            outputs/runs/latest/report/report.html
            outputs/runs/latest/report/report.pdf
            outputs/runs/latest/figures/rarefaction.png
            outputs/runs/latest/figures/event_spacing.png
            outputs/runs/latest/figures/event_threshold_sensitivity.png
            outputs/runs/latest/figures/rai_species.png
            outputs/runs/latest/figures/diel_overall.png
            outputs/runs/latest/session_info.txt
            outputs/runs/latest/run_manifest.json
