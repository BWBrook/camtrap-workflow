schema_version_path: "schema_version.txt"
run_id: "forest_example"
timezone: "UTC"
event_threshold_minutes: 15
input_mode: "four_table"

validation:
  repair_decisions: []

camtrapdp_acquisition:
  mode: "local"
  cache_dir: "outputs/cache/camtrapdp"
  descriptor_sha256: null
  resource_sha256: {}

paths:
  inputs:
    site: "data/forest_example/site.csv"
    op: "data/forest_example/op.csv"
    obs: "data/forest_example/obs.csv"
    taxa: "data/forest_example/taxa.csv"
    camtrapdp: null
  outputs: "outputs"

analysis:
  rarefaction: true
  report: true

spatial_map:
  enable: true
  surface_var: "ndvi"
  resolution: 200
  buffer_deg: 0.002
  buffer_frac: 0.1
  label_sites: false
  label_size: 2.5
  label_nudge_frac: 0.01
  show_north_arrow: true
  show_scale_bar: true
  scale_bar_km: 1

time_qc:
  backward_jump_threshold_hours: 1

diel:
  method: "flash"
  day_start_hour: 6
  day_end_hour: 18

sensitivity:
  event_threshold_minutes: [5, 15, 30, 60]
  occasion_length_days: [3, 7, 14, 30]

detection_history:
  occasion_length_days: 7
  start_date: null

occupancy:
  species: ["roo", "pos", "fox", "cat", "ban"]
  top_n: 3
  covariates: ["canopy_h_m", "ndvi"]

traits:
  species_column: "short"
  columns: ["diet", "sec_diet", "activity", "habitat", "status", "body_size", "sociality", "mobility"]
  association_traits: ["diet", "activity", "habitat", "body_size", "status"]
  environment_vars: ["elevation_m", "canopy_h_m", "ndvi"]

camtrapdp_export:
  enable: false
  name: "camtrap-workflow-export"
  title: "camtrap-workflow export"
  description: "Camtrap DP export generated by camtrap-workflow."
  version: "1.0.1"
  license: "CC-BY-4.0"
  id: null
  created: null
